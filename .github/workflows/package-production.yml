name: Package ArkSide
on:
  push:
    branches: ['codex/package-arkside']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-2025
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore GameSidebar.sln --locked-mode
      - run: dotnet test GameSidebar.sln -c Release --no-restore --logger "trx;LogFilePrefix=windows" --results-directory artifacts/release-checks/tests
      - run: python -m pip install -r tools/offline_recognition/requirements-build.txt
      - name: Verify offline recognition regressions
        run: python -m tools.offline_recognition.verify --output-dir artifacts/release-checks/windows-regressions
      - run: ./tools/package-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ArkSide-Windows-x64
          if-no-files-found: error
          path: |
            artifacts/release/windows/ArkSide-Windows-x64.zip
            artifacts/release/windows/ArkSide-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArkSide-Windows-verification
          path: artifacts/release-checks
