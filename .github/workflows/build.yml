name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-15
          - platform: windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore GameSidebar.sln --locked-mode
      - run: dotnet build GameSidebar.sln -c Release --no-restore
      - run: dotnet test GameSidebar.sln -c Release --no-build --no-restore --logger "trx;LogFilePrefix=${{ matrix.platform }}" --results-directory artifacts/test-results
      - name: Compile production interface
        run: dotnet build src/GameSidebar.App/GameSidebar.App.csproj -c Release --no-restore -p:ArkSideProduction=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}-test-results
          path: artifacts/test-results/*.trx
