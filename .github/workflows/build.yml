name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore GameSidebar.sln --locked-mode
      - run: dotnet build GameSidebar.sln -c Release --no-restore
      - run: dotnet test GameSidebar.sln -c Release --no-build --no-restore --logger "trx;LogFilePrefix=mac" --results-directory artifacts/test-results
      - run: tools/package-macos.sh
      - name: Check and package Mac app
        run: |
          test -x artifacts/GameSidebar-Dev.app/Contents/MacOS/GameSidebar.App
          test -f artifacts/GameSidebar-Dev.app/Contents/MacOS/target-game.example.json
          test -f artifacts/GameSidebar-Dev.app/Contents/MacOS/libGameSidebarMac.dylib
          test -f artifacts/GameSidebar-Dev.app/Contents/MacOS/runtimes/osx-arm64/native/libMaaFramework.dylib
          ditto -c -k --sequesterRsrc --keepParent artifacts/GameSidebar-Dev.app artifacts/GameSidebar-osx-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GameSidebar-osx-arm64
          path: artifacts/GameSidebar-osx-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-results
          path: artifacts/test-results/*.trx

  windows:
    runs-on: windows-2025
    env:
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore GameSidebar.sln --locked-mode
      - run: dotnet build GameSidebar.sln -c Release --no-restore
      - run: dotnet test GameSidebar.sln -c Release --no-build --no-restore --logger "trx;LogFilePrefix=windows" --results-directory artifacts/test-results
      - run: dotnet restore src/GameSidebar.App/GameSidebar.App.csproj -p:RuntimeIdentifier=win-x64 --locked-mode
      - run: dotnet publish src/GameSidebar.App/GameSidebar.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/GameSidebar-win-x64
      - run: dotnet restore tools/GameSidebar.TestWindow/GameSidebar.TestWindow.csproj -p:RuntimeIdentifier=win-x64 --locked-mode
      - run: dotnet publish tools/GameSidebar.TestWindow/GameSidebar.TestWindow.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/TestWindow-win-x64
      - name: Check ZIP contents and package separately
        shell: pwsh
        run: |
          Copy-Item 'Windows-B2-测试清单.md' artifacts/GameSidebar-win-x64/Windows-B2-checklist.md
          if (!(Test-Path artifacts/GameSidebar-win-x64/GameSidebar.App.exe)) { throw 'App exe missing' }
          if (!(Test-Path artifacts/GameSidebar-win-x64/profiles/diagnostic-1920x1080.json)) { throw 'Diagnostic profile missing' }
          if (!(Test-Path artifacts/GameSidebar-win-x64/target-game.example.json)) { throw 'Target example missing' }
          if (!(Test-Path artifacts/GameSidebar-win-x64/runtimes/win-x64/native/MaaFramework.dll)) { throw 'Maa Native missing' }
          if (!(Test-Path artifacts/GameSidebar-win-x64/runtimes/win-x64/native/MaaWin32ControlUnit.dll)) { throw 'Maa Win32 missing' }
          if (!(Test-Path artifacts/TestWindow-win-x64/GameSidebar.TestWindow.exe)) { throw 'TestWindow exe missing' }
          Compress-Archive -Path artifacts/GameSidebar-win-x64/* -DestinationPath artifacts/GameSidebar-win-x64.zip -Force
          Compress-Archive -Path artifacts/TestWindow-win-x64/* -DestinationPath artifacts/TestWindow-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: artifacts/test-results/*.trx
      - uses: actions/upload-artifact@v4
        with:
          name: GameSidebar-win-x64
          path: artifacts/GameSidebar-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TestWindow-win-x64
          path: artifacts/TestWindow-win-x64.zip
